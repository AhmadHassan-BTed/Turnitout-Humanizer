<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Turnitout - Academic Writing &amp; Citation Assistant</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overscroll-behavior: none;
    }

    /* Full-bleed edge-to-edge Streamlit embed container (clips outer 2px border & 34px embed bar) */
    #twa-frame {
      position: fixed;
      top: -3px;
      left: -3px;
      width: calc(100vw + 6px);
      height: calc(100dvh + 40px);
      border: 0;
      background: #000000;
      z-index: 1;
    }

    /* Instant dark splash while cloud node wakes up */
    #boot-veil {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #boot-veil.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo-wrap {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 36px rgba(220, 38, 38, 0.28);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .status-txt {
      font-size: 14px;
      color: #94A3B8;
      letter-spacing: 0.01em;
    }
    .mirror-btn {
      display: none;
      margin-top: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #DC2626;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="boot-veil">
    <div class="logo-wrap">
      <img src="assets/icon-192.png" alt="Turnitout" />
    </div>
    <div class="status-txt" id="status-txt">Connecting to Turnitout...</div>
    <button class="mirror-btn" id="mirror-btn" type="button">Switch to Worker Node</button>
  </div>

  <iframe
    id="twa-frame"
    title="Turnitout"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    (function () {
      var nodes = [
        "https://turnitout.streamlit.app",
        "https://turnitout1.streamlit.app",
        "https://turnitout2.streamlit.app",
        "https://turnitout3.streamlit.app",
        "https://turnitout4.streamlit.app",
        "https://turnitout5.streamlit.app",
        "https://turnitout6.streamlit.app",
        "https://turnitout7.streamlit.app"
      ];
      var nodeIdx = 0;
      var frame = document.getElementById("twa-frame");
      var veil = document.getElementById("boot-veil");
      var statusTxt = document.getElementById("status-txt");
      var mirrorBtn = document.getElementById("mirror-btn");

      var params = new URLSearchParams(window.location.search);
      var pageParam = params.get("page");
      var settled = false;
      var loadGen = 0;
      var slowTimer = null;
      var revealTimer = null;
      var frameLoaded = false;
      var healthOk = false;

      function buildUrl(base, idx) {
        var u = base + "/?embed=true&embed_options=dark_theme&source=twa";
        if (idx > 0) {
          u += "&node=worker";
        }
        if (pageParam) {
          u += "&page=" + encodeURIComponent(pageParam);
        }
        return u;
      }

      function revealFrame(delayMs, gen) {
        if (settled || gen !== loadGen) return;
        settled = true;
        if (slowTimer) clearTimeout(slowTimer);
        if (revealTimer) clearTimeout(revealTimer);
        revealTimer = setTimeout(function () {
          if (gen === loadGen) {
            veil.classList.add("hidden");
          }
        }, delayMs);
      }

      function probeNode(base, timeoutMs) {
        if (typeof AbortController === "undefined" || typeof fetch === "undefined") {
          return Promise.resolve(true);
        }
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, timeoutMs);
        return fetch(base + "/~/+/_stcore/health", {
          mode: "no-cors",
          cache: "no-store",
          signal: ctrl.signal
        }).then(function () {
          clearTimeout(timer);
          return true;
        }).catch(function () {
          clearTimeout(timer);
          return false;
        });
      }

      function connectNode(idx, autoAttempt) {
        loadGen += 1;
        var myGen = loadGen;
        settled = false;
        frameLoaded = false;
        healthOk = false;
        nodeIdx = idx % nodes.length;
        veil.classList.remove("hidden");
        if (slowTimer) clearTimeout(slowTimer);
        if (revealTimer) clearTimeout(revealTimer);

        statusTxt.textContent = nodeIdx === 0
          ? "Connecting to Turnitout..."
          : "Connecting to Backup Server " + nodeIdx + "...";
        mirrorBtn.style.display = "none";

        frame.src = buildUrl(nodes[nodeIdx], nodeIdx);

        // Show manual fallback switcher if a node takes a while to wake up
        slowTimer = setTimeout(function () {
          if (myGen === loadGen && !settled) {
            statusTxt.textContent = "Server is waking up...";
            mirrorBtn.style.display = "inline-block";
          }
        }, 7000);

        // Stay on turnitout.streamlit.app whenever healthy; auto-failover only on timeout/error
        probeNode(nodes[nodeIdx], 6500).then(function (healthy) {
          if (myGen !== loadGen) return;
          if (healthy) {
            healthOk = true;
            if (frameLoaded) {
              revealFrame(1800, myGen);
            } else {
              revealTimer = setTimeout(function () {
                revealFrame(1200, myGen);
              }, 3500);
            }
          } else {
            mirrorBtn.style.display = "inline-block";
            statusTxt.textContent = "Primary node busy, switching to fallback...";
            if (autoAttempt < nodes.length - 1) {
              connectNode(nodeIdx + 1, autoAttempt + 1);
            }
          }
        });
      }

      frame.addEventListener("load", function () {
        frameLoaded = true;
        if (healthOk || typeof fetch === "undefined") {
          revealFrame(1800, loadGen);
        }
      });

      mirrorBtn.addEventListener("click", function () {
        connectNode(nodeIdx + 1, 0);
      });

      connectNode(0, 0);
    })();
  </script>
</body>
</html>
